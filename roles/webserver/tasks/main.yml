---
# tasks file for webserver
- name: installing depended apps
  dnf:
   name: 
    - httpd
    - httpd
    - mariadb-server
    - php
    - php-mysqlnd
    - php-gd
    - php-mbstring
    - php-xml
    - php-json
    - php-curl
    - tar
    - wget
    - unzip 
    - policycoreutils-python-utils
   state: latest
- name: Start and enable Apache
  service:
   name: httpd
   state: started
   enabled: true
- name: Start and enable MariaDB
  service:
   name: mariadb
   state: started
   enabled: true
- name: Download WordPress
  get_url:
   url: https://wordpress.org/latest.tar.gz
   dest: /tmp/wordpress.tar.gz
   mode: '0644'
- name: Extract WordPress
  unarchive:
   src: /tmp/wordpress.tar.gz
   dest: /tmp
   remote_src: true
- name: Copy WordPress to Apache document root
  copy:
   src: /tmp/wordpress/
   dest: "{{ wordpress_dir }}/"
   remote_src: true
- name: Set WordPress ownership
  file:
   path: "{{ wordpress_dir }}"
   owner: apache
   group: apache
   recurse: true

- name: Set WordPress directory permissions
  file:
   path: "{{ wordpress_dir }}"
   mode: '0755'
   recurse: true
- name: Set SELinux context
  command:
   cmd: >
    semanage fcontext -a -t httpd_sys_rw_content_t
    "{{ wordpress_dir }}(/.*)?"
   failed_when: false
- name: Apply SELinux context
  command:
   cmd: >
    restorecon -Rv "{{ wordpress_dir }}"
- name: Allow HTTP through firewall
  firewalld:
   service: http
   permanent: true
   immediate: true
   state: enabled
- name: Restart Apache
  service:
   name: httpd
   state: restarted

