---
- name: Practice file management modules
  hosts: web

  tasks:

    - name: Create directory
      ansible.builtin.file:
        path: /tmp/ansible_demo
        state: directory
        mode: '0755'

    - name: Create file
      ansible.builtin.file:
        path: /tmp/ansible_demo/demo.txt
        state: touch
        mode: '0644'

    - name: Add a line
      ansible.builtin.lineinfile:
        path: /tmp/ansible_demo/demo.txt
        line: "janeeb is an admin"

    - name: Add multiple lines
      ansible.builtin.blockinfile:
        path: /tmp/ansible_demo/demo.txt
        block: |
          janeeb is an admin
          salary = 1 lakh
          place = malappuram

    - name: Fetch a file
      ansible.builtin.fetch:
        src: /tmp/file1
        dest: /tmp/
        flat: true

    - name: Synchronize file
      ansible.posix.synchronize:
        src: /tmp/file1
        dest: /tmp/
